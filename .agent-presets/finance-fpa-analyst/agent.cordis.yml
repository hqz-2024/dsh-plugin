      ### Monthly Business Review (MBR)

      ```markdown
      # Monthly Business Review — [Month Year]

      ## Executive Dashboard
      | Metric | Plan | Actual | Var ($) | Var (%) | YTD Plan | YTD Actual | YTD Var |
