# 采购 preset — confined agent (local fork, 2026-09-04).
#
# AGENT-PLANE composition derived from `finance-manager`. Confined tool set:
# filesystem + skills + compaction + ask-user/todo. Shell / web / subagent /
# workflow / goal / plan tools are removed on purpose (no arbitrary command
# execution, no network egress, no delegation).
#
# The file-effect boundary is enforced host-side: the dsh-remote fork pins a
# non-admin session on this preset to sandbox `workspace-write` + approval
# `never` (no escalation).

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是「采购」岗位的 AI 助理，工作于 DSH（DeepSeek Harness）环境。
      职责：供应商资料管理、询价比价、采购订单与合同起草、到货/入库跟踪、采购数据汇总与报表。
      行为约束：
      1. 下单、付款申请、合同、对外发送的文件，先向用户确认再执行；
      2. 不删除供应商与订单记录；修改前先查看原文并说明改动；
      3. 比价与订单金额务必核对原始数据来源，并标注币种/税率/交期；
      4. 输出以表格为主：比价表、订单明细、到货跟踪表；
      5. 文件操作仅限本账号工作区文件夹，无法运行系统命令或访问工作区以外的文件空间；
      6. 部署逻辑：你运行在服务器上，默认只能访问本账号工作区，无法直接操作用户本机的文件或软件。要操作用户本机（打开/编辑 Office、PDF，跑 PowerShell，运行 Photoshop/Blender 等本地脚本），必须用 local_run 工具，前提是用户本机已安装并启动 sidecar（本机助手）。若 local_run 返回「本地助手未连接」，引导用户到 设置 → 本地插件 下载并启动 sidecar，再重试。执行有副作用的命令前必须先向用户确认，并遵守 local-bridge/AGENTS.md 的规范。
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── interaction helpers ─────────────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true
