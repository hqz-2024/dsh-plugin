# pilot-auth profile patch — the plan's §2.5 flow under a REAL login gate.
#
# `pilot` runs without dsh-remote, so its routes are ungated. That proves the
# client-execution machinery but not the two things that only exist with a gate:
# that `publicPrefixes` actually lets the relay through, and that
# `/client-auth/login` can turn a verified session into an executor token.
# This profile adds the gate and seeds one admin so both are testable.

# ── the gate ──────────────────────────────────────────────────────────────────
# A patch replaces the row's whole `config`, so the complete value is restated.
- id: remote
  config:
    enabled: true
    adminOnly: false
    enforceRoles: true
    # Provision the first admin at startup: the browser bootstrap endpoint is
    # loopback-only and no browser drives this profile.
    # Both accounts are seeded here rather than relying on `bootstrap` for the
    # admin: dsh-remote applies `accounts` seeds BEFORE `bootstrap`, and
    # `bootstrap` is skipped as soon as any account exists. Seeding the viewer
    # therefore suppressed the admin's creation, and the next login failed with
    # "invalid credentials" rather than anything naming the missing account.
    accounts:
      - username: probe-admin
        password: probe-admin-password
        role: admin
      # A non-admin: the admin surface must refuse it, and only an account that
      # exists can show that.
      - username: probe-viewer
        password: probe-viewer-password
        role: user
    # Every client-execution surface is reached by a program on the user's
    # machine, which holds a token rather than a browser session cookie:
    #   /executor      WebSocket upgrade, authenticated by the executor token
    #   /client-auth   Bearer executor token, or the session for `login` only
    #   /client-relay  path secret
    # All three verify their own caller, so the gate must let them through. The
    # upgrade gate needed this too — without it the executor could never connect
    # and the whole feature was unreachable behind a real login gate.
    publicPrefixes:
      - /executor
      - /client-auth
      - /client-relay
    roleMap:
      probe-admin:
        workspaces: []

# ── the client-execution surface ──────────────────────────────────────────────
- id: subprocess
  disabled: true
- id: subprocess-dispatch
  disabled: false
  config:
    serverRuntime: '@deepseek-ai/dsh-subprocess-local'
    refreshMs: 1000
    tracePath: !!js dshHomePath('profiles/pilot-auth/dispatch-trace.jsonl')
    tokens:
      pilot-auth-executor-token-0123456789: probe-primary
    relayPorts: [3845, 38450]
    relayTokens:
      pilot-auth-relay-secret-abcdef0123456789: probe-primary
    authPath: '/client-auth'
    # 「可见路径建议」的测试样例：服务器目录 → 客户端看到的共享路径，绑定页拿它预填。
    # 真实部署的规则在 profiles/web-client/cordis.patch.yml。
    visiblePathHints:
      - serverRoot: 'C:\Users\bestarc\Desktop'
        uncPrefix: '\\192.168.28.239\ws-'

- id: client-bindings
  config:
    heartbeatMs: 1000
    graceMs: 20000
    sweepMs: 1000

- id: subprocess-probe
  config:
    workspaceTitle: 宝单科技资料
    username: probe-primary
    visiblePath: 'C:\dsh-executor-root'
    reindexMs: 2500
    executorWaitMs: 40000
    serverPort: 3084
    fixturePort: 38450
    relaySecret: pilot-auth-relay-secret-abcdef0123456789
    executorToken: pilot-auth-executor-token-0123456789
    # Turns on the gated-flow block: log in, then prove the gate is on, the
    # relay bypasses it, and a session yields an executor token.
    loginUser: probe-admin
    loginPassword: probe-admin-password
    viewerUser: probe-viewer
    viewerPassword: probe-viewer-password
    # Permission consistency (plan §2.1). The profile seeds
    # `auth/session-owners.json` with these two ids before boot; the store reads
    # that file once, so it must exist by then.
    ownSession: sess-occupant-fixture
    foreignSession: sess-foreign-fixture
    # Plan §4.5/§4.6 disconnect scenario: the probe arms a live child + terminal,
    # writes this marker, and the harness then kills the executor.
    crashMarker: !!js dshHomePath('profiles/pilot-auth/crash-armed.marker')
    resultPath: !!js dshHomePath('profiles/pilot-auth/probe-result.jsonl')
