# pilot profile patch — verification harness for ~/.dsh/docs/plan-client-world.md
#
# Swaps the single `ctx.subprocess` provider for the dispatching one and mounts
# the real binding store, so the `cwd -> workspace -> binding` chain runs end to
# end without touching the live `web` profile.
#
# The base bundle declares its provider row as `id: subprocess`
# (packages/bundle/base/cordis.patch.yml) — NOT `subprocess-local`.

# 1. Release the `subprocess` service name from the base provider.
- id: subprocess
  disabled: true

# 2. Enable the dispatcher (its own bundle patch inserts it disabled). A patch
#    replaces the row's whole `config`, so the complete value is restated here.
- id: subprocess-dispatch
  disabled: false
  config:
    serverRuntime: '@deepseek-ai/dsh-subprocess-local'
    refreshMs: 1000
    tracePath: !!js dshHomePath('profiles/pilot/dispatch-trace.jsonl')
    tokens:
      pilot-executor-token-0123456789: probe-primary
    # Client-loopback relay (plan P4). 38450 is the probe's fixture service;
    # 3845 is Figma's Dev Mode MCP port, kept here so the real endpoint needs no
    # composition change once someone has Figma running.
    relayPorts: [3845, 38450]
    relayTokens:
      pilot-relay-secret-abcdef0123456789: probe-primary

# 3. The binding store, on a deliberately short clock: the pilot proves expiry
#    in seconds instead of the production two minutes. Production values live in
#    the bundle patch's own defaults.
- id: client-bindings
  config:
    heartbeatMs: 1000
    # Long enough that the executor's own heartbeat is what keeps the binding
    # alive during the scenario, rather than the scenario finishing in time.
    graceMs: 20000
    sweepMs: 1000

# 4. The harness: drives the real store and the real dispatcher, and starts a
#    client execution whose child prints facts only the executing machine knows.
- id: subprocess-probe
  config:
    workspaceTitle: smbtest
    username: probe-primary
    # 计划 §4.3 明确要求 P2 定死一件事：**UNC 能不能当进程工作目录**。
    # 生产配置里可见路径**就是** UNC，而此前所有 spawn 用例用的都是本地路径
    # （C:\dsh-executor-root），所以这条一直没被测到。结论：能（见
    # docs/plan-client-world-progress.md §1「UNC 当工作目录」）。
    # 所以 pilot 固定成 UNC（生产形态），pilot-auth 保留本地路径 —— 两个 profile
    # 合起来把两种形态都覆盖了。
    #
    # ⚠️ 前置：本机账号对共享没有权限（共享 ACL 只给了 dshtest），跑之前先在同一个
    #    登录会话里建一次凭据，否则客户端子进程进不去这个目录：
    #      net use \\192.168.28.239\ws-smbtest /user:dshtest <密码>
    #    跑完可以 net use ... /delete 收掉。
    visiblePath: '\\192.168.28.239\ws-smbtest'
    reindexMs: 2500
    executorWaitMs: 40000
    serverPort: 3082
    fixturePort: 38450
    relaySecret: pilot-relay-secret-abcdef0123456789
    executorToken: pilot-executor-token-0123456789
    # P3 acceptance names a python REPL. A server-absolute path is what a real
    # shell call passes, so this also exercises the executor's argv[0] rule.
    pythonPath: 'C:\Users\bestarc\AppData\Local\Programs\Python\Python313\python.exe'
    resultPath: !!js dshHomePath('profiles/pilot/probe-result.jsonl')
